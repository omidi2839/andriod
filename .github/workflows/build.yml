name: Build Almas Shop
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, both]
        default: android
      api_base:
        description: HTTPS API base (empty uses ALMAS_API_BASE repository variable or default)
        type: string
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: almas-shop-${{ github.ref }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: false
env:
  ALMAS_API_BASE: ${{ inputs.api_base || vars.ALMAS_API_BASE || 'https://sejadalmas.iq/' }}
jobs:
  android:
    if: ${{ github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION || '' }}
          cache: true
      - name: Prepare runners and validate
        run: |
          flutter --version
          bash ci/validate-api.sh
          bash bootstrap.sh
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build installable Android test APK
        run: |
          flutter build apk --debug --dart-define="ALMAS_API_BASE=$ALMAS_API_BASE" --build-number="${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/AlmasShop-1.0.1-android-test.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: AlmasShop-Android-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Build signed Android release (optional)
        if: ${{ vars.ANDROID_RELEASE_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 ci/android-sign.py
          flutter build apk --release --dart-define="ALMAS_API_BASE=$ALMAS_API_BASE" --build-number="${GITHUB_RUN_NUMBER}"
          flutter build appbundle --release --dart-define="ALMAS_API_BASE=$ALMAS_API_BASE" --build-number="${GITHUB_RUN_NUMBER}"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/AlmasShop-1.0.1-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release/AlmasShop-1.0.1-release.aab
          (cd release && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: ${{ vars.ANDROID_RELEASE_SIGNING == 'true' }}
        with:
          name: AlmasShop-Android-Release
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/release-upload.jks
  ios:
    if: ${{ github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION || '' }}
          cache: true
      - name: Prepare runners and validate
        run: |
          flutter --version
          xcodebuild -version
          bash ci/validate-api.sh
          bash bootstrap.sh
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build unsigned iOS device app (not installable)
        run: |
          flutter build ios --release --no-codesign --dart-define="ALMAS_API_BASE=$ALMAS_API_BASE" --build-number="${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/AlmasShop-1.0.1-iOS-unsigned.zip
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: AlmasShop-iOS-Unsigned-NOT-INSTALLABLE
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Build signed IPA (optional)
        if: ${{ vars.IOS_RELEASE_SIGNING == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
        run: bash ci/ios-sign.sh
      - uses: actions/upload-artifact@v4
        if: ${{ vars.IOS_RELEASE_SIGNING == 'true' }}
        with:
          name: AlmasShop-iOS-Signed-IPA
          path: signed/*.ipa
          if-no-files-found: error
          retention-days: 30
